
name: West Palm Beach Transit Reel

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Find West Palm Beach transit feeds
        run: uv run transit-reels find "West Palm Beach"

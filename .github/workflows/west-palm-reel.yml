
name: Palm Beach County Transit Reel

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Render countywide morning rush
        run: |
          uv run transit-reels render recipes/palm-beach-county.toml

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: palm-beach-county-reel
          path: work/palm-beach-county/*.mp4
          if-no-files-found: error

